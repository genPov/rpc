  gnb:
    image: ${DOCKERHUB_USER-catcert}/open5gs-gnb:${IMAGE_TAG-latest}
    depends_on:
      - run
    network_mode: host
    cap_add:
      - NET_ADMIN
    devices:
      - "/dev/net/tun:/dev/net/tun"
    restart: unless-stopped
    volumes:
      - ${RPC_ROOT:-.}/BaseStation/GNB/config:/app/config:ro
    environment:
      TARGETS_CSV: ${SERVER_IP-34.64.143.22}:4999
    command:
      - /bin/bash
      - -lc
      - tr -d '\r' < /app/config/open5gs-gnb.yaml > /tmp/open5gs-gnb.in.yaml && sed -i 's/\r$//' /app/run-gnb.sh && exec /bin/bash /app/run-gnb.sh /tmp/open5gs-gnb.in.yaml

  ue:
    image: ${DOCKERHUB_USER-catcert}/open5gs-ue:${IMAGE_TAG-latest}
    depends_on:
      - gnb
    network_mode: host
    cap_add:
      - NET_ADMIN
    devices:
      - "/dev/net/tun:/dev/net/tun"
    restart: unless-stopped
    volumes:
      - ${RPC_ROOT:-.}/BaseStation/UE/config:/app/config
    command:
      - /bin/bash
      - -lc
      - sed -i 's/\r$//' /app/entrypoint.sh && exec bash /app/entrypoint.sh
    environment:
      - UDP_TARGET_IP=${SERVER_IP-34.64.143.22}:4999

volumes:
  mongodb: {}
  home: {}
