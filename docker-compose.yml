services:
  strapi:
    image: ${DOCKERHUB_USER-catcert}/open5gs-strapi:${IMAGE_TAG-latest}
    ports:
      - "1337:1337"
    volumes:
      - ${RPC_ROOT:-.}/portal/app:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      DATABASE_CLIENT: sqlite
      DATABASE_FILENAME: ./data/data.db
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      NODE_ENV: production
      APP_KEYS: Th1sIsAKeyForStrapi1,Th1sIsAKeyForStrapi2
      API_TOKEN_SALT: Th1sIsAS4ltF0rAp1T0k3n
      ADMIN_JWT_SECRET: Th1sIsAK3yF0rAdm1nJwt
      JWT_SECRET: Th1sIsAK3yF0rJwt
    depends_on:
      mailhog:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:1337/_health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M

  frontend:
    image: ${DOCKERHUB_USER-catcert}/open5gs-frontend:${IMAGE_TAG-latest}
    ports:
      - "3000:3000"
    environment:
      STRAPI_API_URL: http://strapi:1337
    depends_on:
      strapi:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M

  mailhog:
    image: mailhog/mailhog
    ports:
      - "8025:8025"
    restart: unless-stopped

  mongodb:
    image: mongo
    container_name: open5gs-mongodb
    ports:
      - "27017:27017"
    restart: unless-stopped
    volumes:
      - mongodb:/data/db
      - ${RPC_ROOT:-.}/BaseStation/open5gs/docs/assets/webui/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1})"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  webui:
    image: ${DOCKERHUB_USER-catcert}/open5gs-webui:${IMAGE_TAG-latest}
    container_name: open5gs-webui
    entrypoint:
      - /bin/bash
      - -lc
      - sed -i 's/\r$//' /usr/local/bin/webui-entrypoint.sh /usr/local/bin/seed-subscriber.sh && exec bash /usr/local/bin/webui-entrypoint.sh
    depends_on:
      - mongodb
    ports:
      - "9999:9999"
    environment:
      DB_URI: mongodb://mongodb/open5gs
      WAIT_HOSTS: mongodb:27017
    restart: unless-stopped

  base:
    image: ${DOCKERHUB_USER-catcert}/open5gs-base:${IMAGE_TAG-latest}
    command: /bin/bash -c "echo 'base' services"

  build:
    image: ${DOCKERHUB_USER-catcert}/open5gs-build:${IMAGE_TAG-latest}
    command: /bin/bash -c "echo 'build' services"

  run:
    image: ${DOCKERHUB_USER-catcert}/open5gs-build:${IMAGE_TAG-latest}
    depends_on:
      mongodb:
        condition: service_healthy
      webui:
        condition: service_started
    network_mode: host
    cap_add:
      - NET_ADMIN
    devices:
      - "/dev/net/tun:/dev/net/tun"
    environment:
      DB_URI: mongodb://localhost/open5gs
    volumes:
      - ${RPC_ROOT:-.}/BaseStation/open5gs/runtime-config/open5gs:/usr/local/etc/open5gs
    hostname: open5gs-run
    command: >-
      /bin/bash -c "
        /root/setup.sh && \
        for svc in nrf scp udr udm ausf pcf nssf amf smf bsf upf; do \
          /usr/local/bin/open5gs-$${svc}d -c /usr/local/etc/open5gs/$${svc}.yaml -D; \
        done; \
        tail -F /usr/local/var/log/open5gs/*.log
      "

  # test:
